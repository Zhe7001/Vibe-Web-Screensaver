<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8a919c">
  <meta name="description" content="MIST — a quiet, grey morning around an old windmill.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.open-meteo.com; base-uri 'none'; form-action 'none'">
  <title>MIST — Your vibe. Your weather.</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23737b86'/%3E%3Cpath d='M10 25h44M5 34h48M14 43h42' stroke='%23edf0f1' stroke-width='3' stroke-linecap='round' opacity='.8'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--ink:#f4f3ef;--muted:#e4e4e2}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8a919c;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#8a919c}
    /* The scene is a stack of separate layers that share one viewBox (set in the script below),
       so only cheap compositor transforms ever move; nothing is re-painted per frame. */
    .world{position:absolute;inset:0;transform:scale(1.02);animation:stillness 120s ease-in-out infinite alternate;will-change:transform}
    .layer{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
    .sky{animation:sky-drift 320s ease-in-out infinite alternate;will-change:transform}
    .fog{will-change:transform;animation:fog-drift 140s ease-in-out infinite alternate}
    .fog.b{animation-duration:190s;animation-direction:alternate-reverse}
    /* Rotor: a small square centred on the hub; position/size come from the script (defaults match a 16:9 view).
       The wrapper squashes it a little, as if the sails were seen at an angle, like in the photo. */
    .rotor{position:absolute;left:var(--rl,51.25%);top:var(--rt,5.55%);width:var(--rw,35%);height:var(--rh,62.2%);transform:scaleX(.74)}
    .rotor svg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
    /* one smooth turn per minute; the script only aligns its phase with the wall clock (animation-delay) */
    .sails{will-change:transform;animation:turn 60s linear infinite}
    .wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,29,40,.34),rgba(22,29,40,.08) 20%,transparent 34%,transparent 62%,rgba(12,18,26,.5)),radial-gradient(ellipse 60% 46% at 6% 100%,rgba(9,14,21,.5),transparent 70%),radial-gradient(ellipse 34% 16% at 17% 0%,rgba(20,27,38,.42),transparent 75%),radial-gradient(ellipse 34% 16% at 83% 0%,rgba(20,27,38,.42),transparent 75%),radial-gradient(ellipse 88% 88% at 50% 48%,transparent 56%,rgba(10,14,22,.36));pointer-events:none}
    .motes{animation:motes 110s ease-in-out infinite alternate;will-change:transform}
    .mottle{position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:soft-light;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 1000 600' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='m' x='0' y='0' width='100%25' height='100%25'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.0035 .0075' numOctaves='5' seed='3'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='linear' slope='0' intercept='1'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23m)'/%3E%3C/svg%3E") center/100% 100%}
    .bloom{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 46% 38% at 33% 60%,rgba(242,232,240,.3),transparent 72%),radial-gradient(ellipse 60% 30% at 70% 8%,rgba(200,208,232,.12),transparent 70%)}
    .grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color;opacity:.15;background:linear-gradient(180deg,#8088ac,#6f8b95)}
    .grain{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.36'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
    .frame{position:relative;z-index:1;width:min(1240px,calc(100% - 80px));height:100%;margin:auto;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(30px,5vh,54px) 0 clamp(38px,7vh,72px)}
    header{display:flex;align-items:flex-start;justify-content:space-between;text-shadow:0 1px 14px #1c232c66}
    .brand{margin:0;font-size:12px;font-weight:650;letter-spacing:.3em;text-transform:uppercase}
    .eyebrow{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#f2f1eecc}
    .lower{display:flex;align-items:flex-end;justify-content:flex-start;text-shadow:0 2px 22px #0c1119aa}
    .readout{text-align:left;flex:none}
    .clock{font-variant-numeric:tabular-nums;font-size:clamp(42px,6vw,68px);font-weight:350;letter-spacing:-.06em;line-height:1}
    .date{margin-top:10px;color:#f1efeddd;font-size:14px;letter-spacing:.055em}
    .weather{display:flex;justify-content:flex-start;align-items:center;gap:9px;margin-top:16px;color:#f1efedee;font-size:13px}
    .weather .dot{width:4px;height:4px;border-radius:50%;background:#f1efedaa}
    .weather.no-temp #temp{display:none}
    .weather.stale{opacity:.55}
    @keyframes fog-drift{from{transform:translate3d(-2.6%,0,0)}to{transform:translate3d(2.6%,0,0)}}
    @keyframes sky-drift{from{transform:translate3d(-1.4%,0,0)}to{transform:translate3d(1.4%,0,0)}}
    @keyframes stillness{from{transform:scale(1.02) translate3d(-.3%,.18%,0)}to{transform:scale(1.04) translate3d(.3%,-.18%,0)}}
    @keyframes turn{to{transform:rotate(360deg)}}
    @keyframes motes{from{transform:translate3d(-2%,1.2%,0)}to{transform:translate3d(2%,-1.2%,0)}}
    .paused *{animation-play-state:paused!important}
    @media(max-width:650px){.frame{width:calc(100% - 40px)}.eyebrow{max-width:130px;text-align:right;line-height:1.5}.wash{background:linear-gradient(180deg,rgba(22,29,40,.34),rgba(22,29,40,.06) 22%,transparent 36%,transparent 58%,rgba(12,18,26,.55))}}
    @media(prefers-reduced-motion:reduce){.world,.sky,.fog,.motes,.sails{animation:none!important}}
  </style>
</head>

      <div class="readout"><time class="clock" id="clock"><span id="hm">--:--</span></time><div class="date" id="date">Loading local time…</div><div class="weather no-temp" id="weather"><span id="temp">—°C</span><span class="dot" aria-hidden="true"></span><span id="condition">Quiet morning</span></div></div>
    </main>
  </div>
  <script>
    /* Scene framing: every layer shares one viewBox. It keeps the mill in view on any screen shape
       (wide, square, portrait) and positions the sails; it also pauses motion while the tab is hidden. */
    (()=>{'use strict';
      const root=document.documentElement, layers=[...document.querySelectorAll('.layer')], rotor=document.querySelector('.rotor');
      const sails=document.querySelector('.sails');
      const MILL_X=1010, HUB_X=1100, HUB_Y=330, R=280;
      let raf=0;
      function frame(){raf=0;
        const W=innerWidth||1600,H=innerHeight||900,a=W/H;
        let vw,vh;if(a>=16/9){vw=1600;vh=vw/a}else{vw=Math.max(900*a,600);vh=vw/a}
        const x0=Math.min(Math.max(MILL_X-vw/2,0),1600-vw), y0=vh<=900?(900-vh)*.12:-(vh-900)*.3;
        const vb=`${x0.toFixed(1)} ${y0.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`;
        layers.forEach(s=>s.setAttribute('viewBox',vb));
        const st=rotor.style;
        st.setProperty('--rl',((HUB_X-R-x0)/vw*100).toFixed(3)+'%');st.setProperty('--rt',((HUB_Y-R-y0)/vh*100).toFixed(3)+'%');
        st.setProperty('--rw',(2*R/vw*100).toFixed(3)+'%');st.setProperty('--rh',(2*R/vh*100).toFixed(3)+'%');
      }
      const queue=()=>{if(!raf)raf=requestAnimationFrame(frame)};
      frame();addEventListener('resize',queue);
      /* Sails = seconds: one smooth turn per minute, the red-tipped sail points straight up at :00 */
      let syncTimer=0;
      function syncSails(){
        const an=sails.getAnimations&&sails.getAnimations()[0];
        if(an){an.currentTime=Date.now()%60000;an.ready.then(()=>{an.currentTime=Date.now()%60000})}
        else{sails.style.animationDelay=`-${((Date.now()%60000)/1000).toFixed(3)}s`}
      }
      function startSails(){clearInterval(syncTimer);syncSails();syncTimer=setInterval(syncSails,5*60*1000)}
      startSails();addEventListener('load',()=>requestAnimationFrame(syncSails));
      document.addEventListener('visibilitychange',()=>{root.classList.toggle('paused',document.hidden);if(document.hidden){clearInterval(syncTimer)}else startSails()});
    })();
  </script>
  <script>
    (()=>{'use strict';
      const $=id=>document.getElementById(id), clock=$('clock'), hm=$('hm'), date=$('date'), weather=$('weather'), temp=$('temp'), condition=$('condition');
      const dateFmt=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'}), timeFmt=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
      function tick(){const now=new Date();hm.textContent=timeFmt.format(now);clock.dateTime=now.toISOString();date.textContent=dateFmt.format(now)}
      tick();setInterval(tick,1000);
      const descriptions={0:'Clear and quiet',1:'Mostly clear',2:'Soft cloud',3:'Overcast',45:'Fog in the air',48:'Fog in the air',51:'Fine drizzle',53:'Light drizzle',55:'Steady drizzle',61:'Rain nearby',63:'Rain nearby',65:'Heavy rain nearby',71:'Snow in the distance',73:'Snowfall',75:'Snowfall',80:'Passing showers',81:'Passing showers',82:'Rain showers',95:'Thunder far away'};
      let coords=null, timer=null, last=false, retry=60000;
      async function update(){if(!coords||document.hidden)return;const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),10000);try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${coords.latitude}&longitude=${coords.longitude}&current=temperature_2m,weather_code&timezone=auto`;const r=await fetch(u,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw Error();const c=(await r.json()).current;if(typeof c?.temperature_2m!=='number')throw Error();temp.textContent=`${Math.round(c.temperature_2m)}°C`;condition.textContent=descriptions[c.weather_code]||'Quiet weather';weather.classList.remove('no-temp','stale');last=true;retry=15*60*1000}catch{if(last)weather.classList.add('stale');else condition.textContent='Quiet air · weather unavailable';retry=Math.min(retry*2,5*60*1000)}finally{clearTimeout(timeout);clearTimeout(timer);timer=setTimeout(update,retry)}}
      function locate(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{coords=p.coords;update()},()=>{if(!last)condition.textContent='Quiet air'},{enableHighAccuracy:false,timeout:10000,maximumAge:600000})}
      locate();document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else if(coords)update()});
    })();
  </script>
</body>
</html>
