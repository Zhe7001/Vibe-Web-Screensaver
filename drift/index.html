<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.open-meteo.com; base-uri 'none'; form-action 'none'">
  <meta name="description" content="DRIFT — a quiet night sky to drift into sleep.">
  <title>DRIFT — Your vibe. Your weather.</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050914'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23e1e9ff'/%3E%3Ccircle cx='18' cy='18' r='1.5' fill='%2397a9d4'/%3E%3Ccircle cx='47' cy='43' r='1.5' fill='%2397a9d4'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8edff;
      --dim: #a3aecb;
      --cloud: 0.12;
      --aurora-opacity: 0.88;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050914;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
    }

    body {
      isolation: isolate
    }

    /* ---------- Фоновые слои ---------- */
    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1
    }

    #meteorCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2
    }

    .space {
      position: fixed;
      inset: -12%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 68% 42%, rgba(35, 65, 112, .28), transparent 44%),
        radial-gradient(ellipse at 12% 82%, rgba(24, 47, 79, .2), transparent 48%),
        linear-gradient(180deg, #050812 0%, #080e20 53%, #070b17 100%);
      z-index: -2
    }

    .haze {
      position: fixed;
      inset: -30%;
      pointer-events: none;
      z-index: -1;
      opacity: calc(.22 + var(--cloud)*0.55);
      transition: opacity 3s ease;
      background:
        radial-gradient(ellipse at 28% 38%, rgba(69, 91, 139, .20), transparent 35%),
        radial-gradient(ellipse at 72% 66%, rgba(39, 63, 112, .22), transparent 37%),
        radial-gradient(ellipse at 53% 18%, rgba(71, 79, 130, .10), transparent 32%);
      animation: drift 110s ease-in-out infinite alternate
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(3, 8, 18, .40), transparent 76%), radial-gradient(ellipse at center, transparent 25%, rgba(1, 3, 10, .30) 100%);
      z-index: 1
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")
    }

    .nebula-layer {
      position: fixed;
      inset: -18%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: .72;
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      transform: rotate(var(--rotation, 0deg));
      will-change: transform
    }

    .nebula.n1 {
      width: 48vw;
      height: 22vw;
      left: 18%;
      top: 14%;
      background: radial-gradient(ellipse at 40% 50%, rgba(72, 103, 177, .12), rgba(51, 76, 145, .07) 38%, rgba(22, 42, 91, 0) 72%);
      animation: nebula-drift 145s ease-in-out infinite alternate
    }

    .nebula.n2 {
      width: 42vw;
      height: 30vw;
      left: 55%;
      top: 43%;
      background: radial-gradient(ellipse at 50% 50%, rgba(94, 77, 167, .11), rgba(43, 67, 133, .06) 42%, rgba(20, 34, 78, 0) 72%);
      animation: nebula-drift 180s ease-in-out infinite alternate-reverse
    }

    .nebula.n3 {
      width: 38vw;
      height: 24vw;
      left: 4%;
      top: 58%;
      background: radial-gradient(ellipse at 45% 45%, rgba(39, 91, 151, .10), rgba(30, 59, 116, .05) 45%, rgba(15, 30, 65, 0) 75%);
      animation: nebula-drift 160s ease-in-out infinite alternate
    }

    /* ---------- Новый лёгкий слой сияния ---------- */
    .glow-layer {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      opacity: var(--aurora-opacity);
      transition: opacity 3s ease;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(80, 140, 220, 0.08), transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(140, 100, 220, 0.06), transparent 70%),
        radial-gradient(ellipse 70% 30% at 30% 70%, rgba(60, 180, 180, 0.05), transparent 70%);
      animation: glow-pulse 25s ease-in-out infinite alternate;
    }

    /* ---------- Интерфейс ---------- */
    header {
      position: fixed;
      z-index: 4;
      left: clamp(26px, 5vw, 76px);
      top: calc(26px + env(safe-area-inset-top, 0px));
      right: clamp(26px, 5vw, 76px);
      pointer-events: none;
      text-align: left;
      text-shadow: 0 0 18px #060a16, 0 0 4px #060a16
    }

    .brand {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: #c9d3ee;
      line-height: 1.4
    }

    .eyebrow {
      margin: 8px 0 0;
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.4
    }

    .info {
      position: fixed;
      z-index: 3;
      left: clamp(24px, 5vw, 76px);
      bottom: clamp(30px, 6vh, 70px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      text-shadow: 0 1px 22px #02040c;
      max-width: min(760px, calc(100vw - 48px))
    }

    .info:before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -60px -90px -60px -60px;
      background: radial-gradient(ellipse closest-side at 36% 50%, rgba(5, 13, 28, .38), rgba(5, 13, 28, .16) 62%, transparent);
      pointer-events: none
    }

    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(64px, 10.5vw, 132px);
      font-weight: 300;
      letter-spacing: -.055em;
      line-height: 1.02;
      color: rgba(207, 218, 241, .84);
      margin: 18px 0 10px;
      white-space: nowrap;
      text-shadow: 0 1px 18px rgba(2, 4, 12, .28)
    }

    .clock .seconds {
      display: inline-block;
      font-size: .28em;
      line-height: 1;
      font-weight: 300;
      letter-spacing: 0;
      color: rgba(154, 177, 211, .72);
      vertical-align: top;
      position: relative;
      margin: clamp(8px, 1.1vw, 16px) 0 0 clamp(8px, 1.1vw, 16px)
    }

    .date {
      font-size: clamp(15px, 1.65vw, 21px);
      letter-spacing: -.015em;
      color: rgba(174, 190, 215, .82);
      line-height: 1.45;
      margin-top: clamp(4px, .7vw, 10px)
    }

    .weather {
      margin-top: clamp(14px, 1.8vw, 24px);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(10px, 1.3vw, 16px);
      color: rgba(182, 193, 219, .78);
      font-size: clamp(13px, 1.35vw, 17px);
      letter-spacing: .01em;
      line-height: 1.6;
      min-height: 24px
    }

    .weather .separator {
      width: 1px;
      height: 27px;
      background: #a8c2df88;
      margin: 0 3px
    }

    .weather .condition {
      color: #9baec7
    }

    .weather {
      transition: opacity 1s ease
    }

    .weather.stale {
      opacity: .55
    }

    .weather.no-temp #temp,
    .weather.no-temp .separator {
      display: none
    }

    /* ---------- Keyframes ---------- */
    @keyframes drift {
      0% {
        transform: translate3d(-1.5%, -.5%, 0) rotate(-2deg) scale(1)
      }

      100% {
        transform: translate3d(1.5%, .8%, 0) rotate(2deg) scale(1.04)
      }
    }

    @keyframes nebula-drift {
      0% {
        transform: translate3d(-1.2%, -.5%, 0) rotate(-2deg) scale(1)
      }

      100% {
        transform: translate3d(1.4%, 1%, 0) rotate(2deg) scale(1.04)
      }
    }

    @keyframes glow-pulse {
      0% {
        transform: translate3d(-1%, -1%, 0) scale(1)
      }

      100% {
        transform: translate3d(1%, 1%, 0) scale(1.05)
      }
    }

    /* ---------- Адаптивность ---------- */
    @media(max-width:650px) {
      header {
        left: 18px;
        right: 18px;
        top: calc(20px + env(safe-area-inset-top, 0px))
      }

      .info {
        bottom: 32px;
        left: 16px;
        max-width: calc(100% - 32px)
      }

      .clock {
        font-size: clamp(58px, 14vw, 92px);
        line-height: 1.02;
        margin: 14px 0 6px
      }

      .weather {
        font-size: 13px
      }
    }

    /* ---------- Reduced Motion ---------- */
    @media(prefers-reduced-motion:reduce) {

      .haze,
      .nebula,
      .glow-layer {
        animation: none !important;
      }

      .grain {
        opacity: .02
      }
    }
  </style>
</head>

      /* ============ Настройки ============ */
      const ROTATION_PERIOD_S = 1800;       // полный оборот неба вокруг Полярной звезды за 30 минут
      const SKY_FRAME_MS = 83;              // ≈12 кадров/с: звёзды движутся и «дышат» очень медленно
      const WEATHER_REFRESH_MS = 15 * 60 * 1000;
      const RETRY_MS = [60e3, 120e3, 300e3]; // повторы после сбоя: 1, 2, затем 5 минут
      const FETCH_TIMEOUT_MS = 10000;

      const CLOUD_DIM_WEAK = .6;            // насколько облака гасят слабые звёзды (при 100% облачности остаётся 40%)

      function seeded(seed) {let x = seed >>> 0; return () => {x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296}}

      /* ============ Звёзды ============
         Небо смотрит на север: полюс вращения (Полярная) стоит в точке pivot, остальное поле вращается вокруг него.
         Звёзды хранятся как смещение от полюса (sX, sY, px) и поворачиваются на общий угол при отрисовке. */
      let starCount = 0;
      let sX, sY, sR, sA, sPhase, sSpeed;
      let brightList = [];
      let bucketLists = [[], [], [], []];

      function makeStars() {
        const rand = seeded(70021);
        const K = fieldR / 130;                          // px на градус склонения: в поле попадают звёзды до Dec ≈ −40°
        const cat = catalogue.filter(s => s[2] >= -40);
        const extra = Math.min(4200, Math.floor(Math.PI * fieldR * fieldR / 1800));   // та же плотность, что на экране
        const total = cat.length + extra;
        sX = new Float32Array(total); sY = new Float32Array(total);
        sR = new Float32Array(total); sA = new Float32Array(total);
        sPhase = new Float32Array(total); sSpeed = new Float32Array(total);

        let i = 0;
        for (const [, ra, dec, mag] of cat) {
          const r = (90 - dec) * K;
          const th = ra / 24 * TAU + 0.13 * TAU;
          sX[i] = r * Math.cos(th); sY[i] = r * Math.sin(th);
          sR[i] = Math.max(.65, 2.45 - (mag + 1.5) * .48);
          sA[i] = Math.max(.15, Math.min(.92, 1.05 - (mag + 1.5) * .19));
          sPhase[i] = rand() * TAU;
          sSpeed[i] = .12 + rand() * .18;
          i++;
        }
        for (let k = 0; k < extra; k++) {
          const r = fieldR * Math.sqrt(rand()), th = rand() * TAU;   // равномерно по площади круга
          sX[i] = r * Math.cos(th); sY[i] = r * Math.sin(th);
          sR[i] = .5 + rand() * .7;
          sA[i] = .10 + rand() * .26;
          sPhase[i] = rand() * TAU;
          sSpeed[i] = .06 + rand() * .14;
          i++;
        }
        starCount = i;

        brightList = [];
        bucketLists = [[], [], [], []];
        for (let j = 0; j < starCount; j++) {
          if (sR[j] > HALO_MIN_R) {brightList.push(j); continue;}
          bucketLists[Math.min(3, (sA[j] * 4) | 0)].push(j);
        }
      }

      /* ============ Resize ============ */
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth; height = innerHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        meteorCanvas.width = Math.round(width * dpr); meteorCanvas.height = Math.round(height * dpr);
        meteorCanvas.style.width = width + 'px'; meteorCanvas.style.height = height + 'px';
        mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        pivotX = width * 0.68; pivotY = height * 0.30;   // полюс вращения — справа сверху, подальше от текста
        fieldR = Math.hypot(Math.max(pivotX, width - pivotX), Math.max(pivotY, height - pivotY)) + 30;
        makeStars();
        draw(performance.now());
      }

      /* ============ Отрисовка неба ============ */
      // Угол привязан к настенным часам: после перезагрузки или возврата на вкладку небо продолжает с того же места.
      const skyAngle = () => reducedMotion.matches ? 0 : -TAU * ((Date.now() / 1000) % ROTATION_PERIOD_S) / ROTATION_PERIOD_S;   // против часовой, как вокруг Полярной

      function draw(now) {
        ctx.clearRect(0, 0, width, height);
        const time = now / 1000;
        const scale = Math.max(width / 1500, height / 850);
        const still = reducedMotion.matches;
        const ang = skyAngle(), cs = Math.cos(ang), sn = Math.sin(ang);
        const weakVis = 1 - cloudCur * CLOUD_DIM_WEAK;       // облака прячут слабые звёзды первыми, но небо не пустеет
        const brightVis = 1 - cloudCur * CLOUD_DIM_BRIGHT;   // яркие остаются заметными
        const xMin = -CULL, xMax = width + CULL, yMin = -CULL, yMax = height + CULL;

        // --- Слабые звёзды: 4 батча по альфа-бакетам ---
        ctx.fillStyle = 'rgba(180,198,238,1)';
        for (let b = 0; b < 4; b++) {
          const list = bucketLists[b];
          if (!list.length) continue;
          ctx.globalAlpha = (0.28 + b * 0.14) * weakVis;
          ctx.beginPath();
          for (let k = 0; k < list.length; k++) {
            const j = list[k];
            const x = pivotX + sX[j] * cs - sY[j] * sn;
            const y = pivotY + sX[j] * sn + sY[j] * cs;
            if (x < xMin || x > xMax || y < yMin || y > yMax) continue;
            const twk = still ? 1 : .78 + .22 * sinAt(time * sSpeed[j] + sPhase[j]);
            const r = Math.max(.55, sR[j] * scale * .8 * twk);
            ctx.moveTo(x + r, y);
            ctx.arc(x, y, r, 0, TAU);
          }
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // --- Яркие звёзды: точечно, с гало и лучами у самых ярких ---
        for (let n = 0; n < brightList.length; n++) {
          const j = brightList[n];
          const x = pivotX + sX[j] * cs - sY[j] * sn;
          const y = pivotY + sX[j] * sn + sY[j] * cs;
          if (x < xMin || x > xMax || y < yMin || y > yMax) continue;
          const wave = sinAt(time * sSpeed[j] + sPhase[j]);
          const twinkle = still ? 1 : .78 + .22 * wave;
          const pulse = still ? 1 : .94 + .06 * wave;
          const alpha = Math.min(1, sA[j] * 1.3) * twinkle * brightVis;
          const radius = sR[j] * scale;
          if (radius <= 0.5) continue;
          const core = Math.max(.7, radius * .48);
          const ray = radius * (sR[j] > 2.15 ? 2.8 : 1.65);
          const haloRadius = radius * (sR[j] > 2.15 ? 5.0 : 3.2);

          ctx.globalAlpha = alpha * .18 * pulse;
          ctx.fillStyle = 'rgba(150,180,255,1)';
          ctx.beginPath(); ctx.arc(x, y, haloRadius, 0, TAU); ctx.fill();

          ctx.globalAlpha = alpha * .26 * pulse;
          ctx.fillStyle = 'rgba(193,215,255,1)';
          ctx.beginPath(); ctx.arc(x, y, haloRadius * .5, 0, TAU); ctx.fill();

          ctx.globalAlpha = alpha * pulse;
          ctx.fillStyle = 'rgba(233,241,255,1)';
          ctx.beginPath(); ctx.arc(x, y, core, 0, TAU); ctx.fill();
          ctx.globalAlpha = 1;

          if (sR[j] > 2.15) {
            const rayGradV = ctx.createLinearGradient(x, y - ray, x, y + ray);
            rayGradV.addColorStop(0, 'rgba(220,233,255,0)');
            rayGradV.addColorStop(.48, `rgba(220,233,255,${alpha * .42})`);
            rayGradV.addColorStop(.52, `rgba(255,255,255,${alpha * .65})`);
            rayGradV.addColorStop(1, 'rgba(220,233,255,0)');
            ctx.strokeStyle = rayGradV; ctx.lineWidth = .65;
            ctx.beginPath(); ctx.moveTo(x, y - ray); ctx.lineTo(x, y + ray); ctx.stroke();

            const rayGradH = ctx.createLinearGradient(x - ray * .72, y, x + ray * .72, y);
            rayGradH.addColorStop(0, 'rgba(220,233,255,0)');
            rayGradH.addColorStop(.5, `rgba(220,233,255,${alpha * .22})`);
            rayGradH.addColorStop(1, 'rgba(220,233,255,0)');
            ctx.strokeStyle = rayGradH; ctx.lineWidth = .45;
            ctx.beginPath(); ctx.moveTo(x - ray * .72, y); ctx.lineTo(x + ray * .72, y); ctx.stroke();
          }
        }
      }

      /* ============ Облачность ============ */
      function stepCloud(dt) {   // плавный переход, без скачка при смене погоды
        const d = cloudTarget - cloudCur;
        cloudCur = Math.abs(d) < .002 ? cloudTarget : cloudCur + d * Math.min(1, dt / 3);
      }
      function setCloud(code, pct) {
        const fog = code === 45 || code === 48;   // туман скрывает звёзды, даже если cloud_cover маленький
        cloudTarget = Math.max(Math.max(0, Math.min(1, (pct || 0) / 100)), fog ? .7 : 0);
        root.style.setProperty('--cloud', cloudTarget.toFixed(2));
        root.style.setProperty('--aurora-opacity', (1 - cloudTarget).toFixed(2));
        if (reducedMotion.matches) {cloudCur = cloudTarget; if (!document.hidden) draw(performance.now());}
      }

      /* ============ Цикл неба (≈12 fps, без rAF) ============ */
      function skyLoop() {
        skyTimer = 0;
        if (document.hidden || reducedMotion.matches) return;
        const ts = performance.now();
        const dt = lastSkyTs ? Math.min((ts - lastSkyTs) / 1000, .5) : 0;
        lastSkyTs = ts;
        stepCloud(dt);
        draw(ts);
        skyTimer = setTimeout(skyLoop, SKY_FRAME_MS);
      }
      function startSky() {if (!skyTimer && !document.hidden && !reducedMotion.matches) {lastSkyTs = 0; skyLoop();} }
      function stopSky() {if (skyTimer) {clearTimeout(skyTimer); skyTimer = 0;} lastSkyTs = 0;}

      /* ============ Метеоры (rAF только пока метеор в полёте) ============ */
      function spawnMeteor() {
        if (document.hidden || reducedMotion.matches) return;
        if (Math.random() < cloudTarget * .8) return;   // сквозь плотные облака метеоров почти не видно
        const angle = (48 + Math.random() * 12) * Math.PI / 180;
        const speed = 250 + Math.random() * 100;
        const duration = 0.7 + Math.random() * .35;
        const x = Math.random() * width * .82 + width * .08;
        const y = Math.random() * height * .38;
        meteors.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          length: 65 + Math.random() * 45,
          speed,
          age: 0,
          life: duration
        });
        if (!meteorRaf) {lastMeteorTs = 0; meteorRaf = requestAnimationFrame(meteorFrame);}
      }

      function drawMeteors(dt) {
        mctx.clearRect(0, 0, width, height);
        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          m.age += dt;
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          const progress = m.age / m.life;
          if (progress >= 1) {meteors.splice(i, 1); continue;}

          const fade = Math.min(1, progress * 7, (1 - progress) * 4);
          const tailX = m.x - m.vx * (m.length / m.speed);
          const tailY = m.y - m.vy * (m.length / m.speed);

          const grad = mctx.createLinearGradient(tailX, tailY, m.x, m.y);
          grad.addColorStop(0, 'rgba(190,216,255,0)');
          grad.addColorStop(.7, `rgba(190,216,255,${.42 * fade})`);
          grad.addColorStop(1, `rgba(242,248,255,${.95 * fade})`);
          mctx.strokeStyle = grad; mctx.lineWidth = 1.25; mctx.lineCap = 'round';
          mctx.beginPath(); mctx.moveTo(tailX, tailY); mctx.lineTo(m.x, m.y); mctx.stroke();

          const g = mctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 4);
          g.addColorStop(0, `rgba(245,249,255,${fade})`);
          g.addColorStop(1, 'rgba(165,202,255,0)');
          mctx.fillStyle = g;
          mctx.beginPath(); mctx.arc(m.x, m.y, 4, 0, TAU); mctx.fill();
        }
      }

      function meteorFrame(ts) {
        meteorRaf = 0;
        if (document.hidden || reducedMotion.matches) {stopMeteors(); return;}
        const dt = lastMeteorTs ? Math.min((ts - lastMeteorTs) / 1000, .05) : 0;
        lastMeteorTs = ts;
        drawMeteors(dt);
        if (meteors.length) meteorRaf = requestAnimationFrame(meteorFrame);   // иначе цикл остановился, canvas уже чист
      }
      function stopMeteors() {
        if (meteorRaf) {cancelAnimationFrame(meteorRaf); meteorRaf = 0;}
        meteors = []; lastMeteorTs = 0;
        mctx.clearRect(0, 0, width, height);
      }
      function clearMeteorTimer() {if (meteorTimer) {clearTimeout(meteorTimer); meteorTimer = 0;} }
      function scheduleMeteor() {
        clearMeteorTimer();
        if (document.hidden || reducedMotion.matches) return;
        meteorTimer = setTimeout(() => {spawnMeteor(); scheduleMeteor();}, 20000 + Math.random() * 25000);
      }

      /* ============ Часы ============ */
      const dateFmt = new Intl.DateTimeFormat('en-US', {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'});
      const hmFmt = new Intl.DateTimeFormat('en-GB', {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
      let clockTimer = null, lastHM = '';

      function tick() {
        const now = new Date();
        const hm = hmFmt.format(now);
        if (hm !== lastHM) {
          lastHM = hm;
          hmEl.textContent = hm;
          clockEl.dateTime = now.toISOString();
          dateEl.textContent = dateFmt.format(now);
        }
        secEl.textContent = String(now.getSeconds()).padStart(2, '0');
      }
      function scheduleTick() {clockTimer = setTimeout(() => {tick(); scheduleTick();}, 1000 - Date.now() % 1000 + 5);}
      function startClock() {if (clockTimer === null) {lastHM = ''; tick(); scheduleTick();} }
      function stopClock() {if (clockTimer !== null) {clearTimeout(clockTimer); clockTimer = null;} }

      /* ============ Погода ============ */
      const weatherDescriptions = {
        0: 'Clear skies', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast',
        45: 'Fog drifting in', 48: 'Fog drifting in',
        51: 'A little drizzle', 53: 'Drizzle', 55: 'Steady drizzle',
        56: 'Icy drizzle', 57: 'Icy drizzle',
        61: 'Light rain nearby', 63: 'Rain nearby', 65: 'Heavy rain nearby',
        66: 'Icy rain nearby', 67: 'Icy rain nearby',
        71: 'Snow falling', 73: 'Snow falling', 75: 'Snow falling', 77: 'Snow falling',
        80: 'Passing showers', 81: 'Passing showers', 82: 'Heavy showers',
        85: 'Snow showers', 86: 'Snow showers',
        95: 'Thunder somewhere far away', 96: 'Thunder somewhere far away', 99: 'Thunder somewhere far away'
      };

      let weatherTimer = 0, weatherLoading = false, lastAttemptAt = 0, nextDelay = WEATHER_REFRESH_MS, failCount = 0, hasWeather = false;

      function stopWeatherTimer() {if (weatherTimer) {clearTimeout(weatherTimer); weatherTimer = 0;} }
      function scheduleWeather() {
        stopWeatherTimer();
        if (document.hidden || !coords || weatherLoading) return;   // идущий запрос сам перепланирует себя в finally
        const delay = Math.max(0, nextDelay - (Date.now() - lastAttemptAt));
        weatherTimer = setTimeout(() => {weatherTimer = 0; if (!document.hidden) refreshWeather();}, delay);
      }
      function refreshWeather() {
        if (!coords) return Promise.resolve();
        return loadWeather(coords.lat, coords.lon).finally(scheduleWeather);
      }

      async function loadWeather(lat, lon) {
        if (weatherLoading) return;
        weatherLoading = true; lastAttemptAt = Date.now();
        const ctrl = new AbortController(), abortTimer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,cloud_cover,weather_code&timezone=auto`;
          const res = await fetch(url, {signal: ctrl.signal, cache: 'no-store'});
          if (!res.ok) throw Error('weather ' + res.status);
          const data = await res.json(), c = data && data.current;
          if (!c || typeof c.temperature_2m !== 'number') throw Error('unexpected weather payload');
          setCloud(c.weather_code, c.cloud_cover);
          tempEl.textContent = `${Math.round(c.temperature_2m)}°C`;
          weatherText.textContent = weatherDescriptions[c.weather_code] || 'Night weather';
          weatherRow.classList.remove('no-temp', 'stale');
          hasWeather = true; failCount = 0; nextDelay = WEATHER_REFRESH_MS;
        } catch (e) {
          failCount++;
          nextDelay = RETRY_MS[Math.min(failCount - 1, RETRY_MS.length - 1)];
          if (hasWeather) weatherRow.classList.add('stale');   // последние данные остаются на экране, но приглушены
          else weatherText.textContent = 'A quiet night · weather unavailable';
        } finally {
          clearTimeout(abortTimer);
          weatherLoading = false;
        }
      }

      /* ============ Геолокация ============ */
      let locating = false, geoDenied = false;
      function locate() {
        if (!navigator.geolocation) {if (!hasWeather) weatherText.textContent = 'A quiet night'; return;}
        if (locating || coords) return;
        locating = true;
        navigator.geolocation.getCurrentPosition(pos => {
          locating = false; geoDenied = false;
          coords = {lat: pos.coords.latitude, lon: pos.coords.longitude};
          refreshWeather();
        }, err => {
          locating = false;
          geoDenied = !!err && err.code === 1;
          if (!hasWeather) weatherText.textContent = 'A quiet night';
        }, {enableHighAccuracy: false, timeout: 10000, maximumAge: 600000});
      }
      function watchGeoPermission() {   // если разрешение выдали позже, подхватываем без перезагрузки
        if (!navigator.permissions || !navigator.permissions.query) return;
        navigator.permissions.query({name: 'geolocation'}).then(st => {
          st.onchange = () => {if (st.state === 'granted') {geoDenied = false; locate();} else if (st.state === 'denied') geoDenied = true;};
        }).catch(() => { });
      }

      /* ============ Жизненный цикл ============ */
      function applyMotion() {
        if (document.hidden) return;
        if (reducedMotion.matches) {
          stopSky(); stopMeteors(); clearMeteorTimer();
          cloudCur = cloudTarget;
          draw(performance.now());   // один статичный кадр
        } else {
          startSky(); scheduleMeteor();
        }
      }

      let resizeTimer = 0;
      addEventListener('resize', () => {clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150);}, {passive: true});
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopSky(); stopMeteors(); clearMeteorTimer(); stopClock(); stopWeatherTimer();
        } else {
          startSky(); startClock(); scheduleMeteor();
          if (coords) scheduleWeather(); else if (!geoDenied) locate();   // просроченные данные обновятся сразу
        }
      });
      addEventListener('online', () => {
        if (document.hidden) return;
        if (coords) {if (failCount > 0) refreshWeather();} else if (!geoDenied) locate();
      });
      reducedMotion.addEventListener?.('change', applyMotion);

      resize();
      startClock();
      watchGeoPermission();
      locate();
      applyMotion();
    })();
  </script>
</body>

</html>
